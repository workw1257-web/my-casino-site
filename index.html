<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d0d12;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .hero-banner {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .section-title {
      color: #ffd700;
      font-size: 1.2rem;
      margin: 15px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }
    .card {
      background: #1a1a24;
      border-radius: 10px;
      padding: 5px;
      border: 1px solid #2a2a38;
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .profile-sec {
      margin: 25px 0 15px;
    }
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      object-fit: cover;
    }
    .contact-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }
    .icon-btn {
      width: 55px;
      height: 55px;
      background: #1a1a24;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
    }
    .icon-btn img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Main Banner -->
    <img src="bg_main.jpg" alt="Casino Banner" class="hero-banner">

    <h2 class="section-title">FEATURED GAMES</h2>

    <!-- Games Grid -->
    <div class="grid">
      <div class="card"><img src="1.png" alt="Game 1"></div>
      <div class="card"><img src="2.png" alt="Game 2"></div>
      <div class="card"><img src="3.png" alt="Game 3"></div>
      <div class="card"><img src="4.png" alt="Game 4"></div>
      <div class="card"><img src="5.png" alt="Game 5"></div>
      <div class="card"><img src="6.png" alt="Game 6"></div>
    </div>

    <!-- Agent Profile -->
    <div class="profile-sec">
      <img src="customer.png" alt="Customer Support" class="profile-img">
    </div>

    <!-- Contact Links -->
    <div class="contact-bar">
      <a href="tel:" class="icon-btn"><img src="call.png" alt="Call"></a>
      <a href="mailto:" class="icon-btn"><img src="email.png" alt="Email"></a>
    </div>
  </div>

</body>
</html>
